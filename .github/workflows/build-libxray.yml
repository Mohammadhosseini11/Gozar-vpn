name: Build libXray Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout libXray
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          path: libXray

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: true

      - name: Show tool versions
        run: |
          python3 --version
          go version
          java -version
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build Android AAR
        working-directory: libXray
        run: python3 build/main.py android

      - name: Check build outputs
        working-directory: libXray
        run: |
          test -f libXray.aar
          ls -lh libXray.aar
          if [ -f libXray-sources.jar ]; then
            ls -lh libXray-sources.jar
          fi

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libxray-android
          path: |
            libXray/libXray.aar
            libXray/libXray-sources.jar
          if-no-files-found: error
          retention-days: 14
